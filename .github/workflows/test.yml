name: Test

# DIAGNOSTIC_458B1：一次性诊断分支专用，不合入。只在 ubuntu / Node 22 上并行跑 4 份完整根测试（保留与正式 CI 相同的并发负载），
# 收集 pending-task-message-injection-startup-sweep「真实账本」每趟清扫的分阶段耗时，以及旧版 2000 次空转预算本会判失败的等待。
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic-task-458b1-root-tests-with-instrumented-real-ledger-sweep:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        repetition: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Build
        run: npm run build

      - name: Runner hardware
        run: nproc && free -m && cat /proc/loadavg

      - name: Root tests
        run: npm test
        env:
          DIAG_458B1_OUTPUT_DIRECTORY: ${{ runner.temp }}/diag-458b1

      - name: Print real-ledger sweep diagnostic summaries
        if: always()
        run: cat "${{ runner.temp }}"/diag-458b1/summary-*.txt || true

      - name: Upload real-ledger sweep diagnostic data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-458b1-repetition-${{ matrix.repetition }}
          path: ${{ runner.temp }}/diag-458b1
