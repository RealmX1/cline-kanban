name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-check-test:
    # 2026-10-05 在 fork 上实测：Node 22 的 job 用时 8–10.5 分钟（根测试 352–384s、web-ui 约 95s），
    # 10 分钟上限已撞上一次（macos 在 web-ui 测试中途被取消），另一次只差 21s。
    # EXPERIMENT_NODE: CI job 上限取 20 分钟；更短 = 慢 runner 上被取消、不出红色报告，更长 = 真挂死时更晚被取消。
    timeout-minutes: 20
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 只测 package.json engines 声明支持的版本（>=22，14b3d0da 起）。Node 20 已于 2026-04-30 停止维护，
        # 上游升 engines 时漏删了它的 job，2026-10-05 移除。
        include:
          - os: ubuntu-latest
            node-version: 22
          # - os: windows-latest
          #   node-version: 22
          - os: macos-latest
            node-version: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # macOS node-gyp/electron rebuilds can fail with Python 3.12/distutils; pin 3.11.
      - name: Setup Python (for node-gyp on macOS)
        if: matrix.os == 'macos-latest'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: npm ci

      - name: Install web-ui dependencies
        run: npm ci --prefix web-ui

      - name: Install packages/desktop dependencies
        run: npm ci --prefix packages/desktop

      - name: Build
        run: npm run build

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Root tests
        run: npm test

      - name: Web UI tests
        run: npm --prefix web-ui run test

      - name: packages/desktop typecheck
        run: npm --prefix packages/desktop run typecheck

      - name: packages/desktop tests
        run: npm --prefix packages/desktop test
